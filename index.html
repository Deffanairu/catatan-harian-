<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Harian</title>
    
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0; padding: 24px; color: #2d3436; min-height: 100vh;
            position: relative; overflow-x: hidden; background-size: 300% 300%;
            animation: gerakLatar 14s ease infinite; transition: background 2s ease-in-out;
            -webkit-font-smoothing: antialiased;
        }

        /* TEMA DINAMIS WAKTU */
        body.tema-pagi { background-image: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb); color: #2c3e50; }
        body.tema-siang { background-image: linear-gradient(-45deg, #89f7fe, #66a6ff, #d4fc79, #96e6a1); color: #1e272e; }
        body.tema-sore { background-image: linear-gradient(-45deg, #f093fb, #f5576c, #4facfe, #00f2fe); color: #ffffff; }
        body.tema-malam { background-image: linear-gradient(-45deg, #09203f, #537895, #141e30, #243b55); color: #f5f6fa; }

        @keyframes gerakLatar {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ELEMEN SUASANA LANGIT */
        .sky-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .celestial-body {
            position: absolute; width: 64px; height: 64px; border-radius: 50%;
            transition: all 1.5s ease-in-out; will-change: transform, opacity;
        }
        .tema-pagi .celestial-body { top: 12%; left: 10%; background: radial-gradient(circle, #ffffff, #ffb199); box-shadow: 0 0 35px rgba(255, 177, 153, 0.7); animation: terbitPagi 4s ease-out forwards, mengapung 6s ease-in-out infinite alternate; }
        .tema-siang .celestial-body { top: 6%; right: 12%; background: radial-gradient(circle, #ffffff, #ffeaa7); box-shadow: 0 0 45px rgba(255, 234, 167, 0.8); animation: mengapung 5s ease-in-out infinite alternate; }
        .tema-sore .celestial-body { top: 40%; right: 10%; background: radial-gradient(circle, #ff9a9e, #fecfef); box-shadow: 0 0 40px rgba(255, 154, 158, 0.7); animation: terbenam 4s ease-out forwards, mengapung 7s ease-in-out infinite alternate; }
        .tema-malam .celestial-body { top: 10%; right: 10%; background: radial-gradient(circle, #ffffff, #dfe6e9); box-shadow: 0 0 30px rgba(255, 255, 255, 0.5); animation: mengapung 8s ease-in-out infinite alternate; }

        @keyframes terbitPagi { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes terbenam { from { transform: translateY(-30px); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
        @keyframes mengapung { 0% { transform: translateY(0px); } 100% { transform: translateY(-6px); } }

        .cloud { position: absolute; background: rgba(255, 255, 255, 0.4); border-radius: 50px; opacity: 0.6; }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.4); border-radius: 50%; }
        .cloud1 { width: 90px; height: 28px; top: 8%; animation: gerakAwan 32s linear infinite; }
        .cloud1::before { width: 36px; height: 36px; top: -16px; left: 16px; }
        .cloud1::after { width: 28px; height: 28px; top: -10px; right: 16px; }
        .cloud2 { width: 130px; height: 36px; top: 20%; animation: gerakAwan 48s linear infinite; animation-delay: -18s; opacity: 0.45; }
        .cloud2::before { width: 48px; height: 48px; top: -20px; left: 20px; }
        .cloud2::after { width: 36px; height: 36px; top: -14px; right: 20px; }
        .tema-malam .cloud, .tema-malam .cloud::before, .tema-malam .cloud::after { background: rgba(255, 255, 255, 0.1); }
        @keyframes gerakAwan { from { left: -150px; } to { left: 105%; } }

        .bird-group { position: absolute; top: 12%; animation: terbang 24s linear infinite; }
        .tema-malam .bird-group { display: none; }
        .bird { position: relative; width: 14px; height: 10px; display: inline-block; margin-right: 6px; }
        .bird::before, .bird::after { content: ''; position: absolute; top: 0; width: 8px; height: 5px; border-top: 1.5px solid rgba(40,40,40,0.55); border-left: 1.5px solid rgba(40,40,40,0.55); border-top-left-radius: 6px; }
        .bird::before { left: 0; transform-origin: right bottom; animation: kepak 0.8s ease-in-out infinite alternate; }
        .bird::after { right: 0; transform: scaleX(-1); transform-origin: right bottom; animation: kepak 0.8s ease-in-out infinite alternate; }
        .bird-2 { top: -5px; transform: scale(0.75); }
        @keyframes kepak { 0% { transform: rotate(0deg); } 100% { transform: rotate(-30deg); } }
        @keyframes terbang { from { left: -50px; } to { left: 105%; } }

        /* KONTEN UTAMA */
        .content-wrapper { position: relative; z-index: 1; max-width: 580px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 24px; }
        header h1 {
            margin: 0; font-size: 26px; font-weight: 700; color: #2c3e50;
            text-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }
        header p {
            margin: 6px 0 0 0; font-size: 13px; font-weight: 400; opacity: 0.85;
        }

        .halaman {
            display: none; background: rgba(255, 255, 255, 0.92); padding: 22px;
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(12px); margin-bottom: 24px; color: #2d3436;
            animation: fadeIn 0.3s ease-out; border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .halaman.aktif { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* GARIS TEPI BIRU LEMBUT TEXTAREA */
        textarea {
            width: 100%; height: 130px; border: 2px solid #dcd6f7; border-radius: 12px;
            padding: 14px; font-size: 15px; line-height: 1.6; resize: none; outline: none;
            font-family: inherit; transition: all 0.25s ease; background: #ffffff;
            color: #2d3436;
        }
        textarea:focus {
            border-color: #a29bfe;
            box-shadow: 0 0 10px rgba(162, 155, 254, 0.4);
        }

        .penghitung-karakter {
            text-align: right; font-size: 11px; color: #7f8c8d; margin-top: 6px; margin-bottom: 12px;
        }

        /* AREA UPLOAD FOTO */
        .area-upload-opsional {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .label-upload {
            font-size: 12px;
            font-weight: 600;
            color: #2d3436;
        }

        .input-file-custom {
            width: 100%;
            padding: 8px 12px;
            font-size: 13px;
            border: 2px solid #dcd6f7;
            border-radius: 10px;
            background: #ffffff;
            color: #555;
            outline: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .input-file-custom:focus {
            border-color: #a29bfe;
        }

        #preview-foto {
            width: 100%; height: auto; max-height: 260px; border-radius: 10px;
            display: none; margin-top: 8px; object-fit: contain; background: #00000005;
            border: 2px solid #dcd6f7;
        }

        /* TOMBOL UTAMA */
        button {
            width: 100%; background: #6c5ce7; color: white; border: none; padding: 14px 18px;
            font-size: 14px; font-weight: 600; letter-spacing: 0.3px; border-radius: 10px;
            margin-top: 14px; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(108, 92, 231, 0.3);
        }
        button:active { transform: scale(0.99); background: #5b4cc4; }

        .btn-sekunder {
            background: #a29bfe; color: #ffffff; border: none;
            box-shadow: 0 4px 14px rgba(162, 155, 254, 0.3); margin-top: 10px;
        }
        .btn-sekunder:active { background: #8e84f5; }

        .header-riwayat {
            display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #edf2f7;
            padding-bottom: 14px; margin-bottom: 18px;
        }
        .header-riwayat h2 {
            margin: 0; font-size: 16px; font-weight: 600; color: #2f3542; letter-spacing: 0.3px;
        }

        .input-cari-teks {
            width: 100%; padding: 10px 12px; border: 2px solid #dcd6f7; border-radius: 10px;
            outline: none; font-family: inherit; font-size: 13px; background: #ffffff;
            color: #2d3436; transition: border-color 0.2s ease;
        }
        .input-cari-teks:focus { border-color: #6c5ce7; }

        .filter-box { display: flex; gap: 8px; }
        input[type="date"] {
            flex: 1; padding: 8px 12px; border: 2px solid #dcd6f7; border-radius: 10px;
            outline: none; font-family: inherit; font-size: 13px; background: #ffffff;
            color: #2d3436;
        }
        input[type="date"]:focus { border-color: #6c5ce7; }

        .btn-reset {
            width: auto; margin-top: 0; padding: 8px 14px; background: #a29bfe;
            color: white; font-size: 12px; font-weight: 500; box-shadow: none;
        }
        .btn-reset:active { background: #8e84f5; }

        .pemisah-bulan {
            background: #6c5ce7; color: #ffffff; padding: 4px 10px; border-radius: 6px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
            margin: 16px 0 10px 0; display: inline-block;
        }

        /* KARTU CATATAN */
        .kartu-catatan {
            background: #ffffff; padding: 16px; border-radius: 12px; margin-bottom: 12px;
            text-align: left; border: 1px solid #eef0f5; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: border-color 0.2s ease;
        }
        
        .tgl-catatan {
            font-size: 12px; color: #6c5ce7; font-weight: 600; letter-spacing: 0.2px;
        }

        .isi-teks-catatan {
            margin: 8px 0 0 0; font-size: 14px; line-height: 1.6; color: #2f3542;
            white-space: pre-wrap; word-break: break-word;
        }

        .kartu-catatan img {
            width: 100%; height: auto; border-radius: 8px; margin-top: 12px;
            display: block; cursor: pointer; transition: opacity 0.2s ease;
            border: 1px solid #edf2f7;
        }
        .kartu-catatan img:active { opacity: 0.85; }

        /* MODAL FULLSCREEN */
        .modal-gambar {
            display: none; position: fixed; z-index: 9999; top: 0; left: 0;
            width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px); flex-direction: column; justify-content: center;
            align-items: center; padding: 12px; overflow: hidden; touch-action: none;
        }
        .modal-gambar.aktif { display: flex; animation: fadeIn 0.25s ease-out; }
        
        .modal-content-wrapper {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        
        .modal-gambar img {
            max-width: 95%; max-height: 85vh; border-radius: 6px; object-fit: contain;
            transition: transform 0.2s ease-out; transform-origin: center center;
            user-select: none;
        }

        .btn-tutup-modal {
            position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.15);
            color: white; border: none; font-size: 16px; font-weight: 300; border-radius: 50%;
            width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; z-index: 10000; transition: background 0.2s;
            margin: 0; padding: 0; box-shadow: none;
        }
        .btn-tutup-modal:active { background: rgba(255,255,255,0.3); }

        #daftar-catatan { font-size: 14px; }
    </style>
</head>
<body id="body-layar">

    <div class="sky-container">
        <div class="celestial-body"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="bird-group">
            <div class="bird"></div>
            <div class="bird bird-2"></div>
        </div>
    </div>

    <!-- MODAL POPUP FULLSCREEN & ZOOM -->
    <div id="modal-viewer" class="modal-gambar">
        <button class="btn-tutup-modal" id="btn-tutup-modal">✕</button>
        <div class="modal-content-wrapper" id="modal-wrapper">
            <img id="img-fullscreen" src="" alt="Lampiran Foto">
        </div>
    </div>

    <div class="content-wrapper">
        <header>
            <h1>Jurnal Harian</h1>
            <p id="tanggal-otomatis"></p>
        </header>

        <!-- HALAMAN 1: TULIS CATATAN -->
        <div id="halaman-tulis" class="halaman aktif">
            <textarea id="isi-catatan" placeholder="Bagaimana harimu hari ini? Tulis di sini..."></textarea>
            <div class="penghitung-karakter" id="penghitung-karakter">0 kata | 0 karakter</div>
            
            <div class="area-upload-opsional">
                <label class="label-upload" for="input-foto">Tambahkan Foto Kenangan (Opsional):</label>
                <input type="file" id="input-foto" class="input-file-custom" accept="image/*">
                <img id="preview-foto" src="" alt="Pratinjau Foto">
            </div>

            <button id="tombol-simpan">Simpan Catatan</button>
            <button id="btn-ke-riwayat" class="btn-sekunder">Lihat Riwayat Catatan</button>
        </div>

        <!-- HALAMAN 2: RIWAYAT & PENCARIAN -->
        <div id="halaman-riwayat" class="halaman">
            <div class="header-riwayat">
                <h2>Riwayat Catatan</h2>
                <input type="text" id="input-cari-teks" class="input-cari-teks" placeholder="Cari berdasarkan kata kunci...">
                <div class="filter-box">
                    <input type="date" id="input-cari-tanggal">
                    <button id="btn-reset-filter" class="btn-reset">Reset</button>
                </div>
            </div>

            <div id="daftar-catatan"></div>
            <button id="btn-ke-tulis" class="btn-sekunder" style="margin-top: 18px;">Kembali Tulis Catatan</button>
        </div>
    </div>

    <script>
        const daftarHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const daftarBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        function aturTemaDanTanggal() {
            const skrg = new Date();
            const jam = skrg.getHours();
            const body = document.getElementById("body-layar");

            document.getElementById("tanggal-otomatis").innerText = `${daftarHari[skrg.getDay()]}, ${skrg.getDate()} ${daftarBulan[skrg.getMonth()]} ${skrg.getFullYear()}`;

            body.className = "";
            if (jam >= 5 && jam < 11) body.classList.add("tema-pagi");
            else if (jam >= 11 && jam < 15) body.classList.add("tema-siang");
            else if (jam >= 15 && jam < 18) body.classList.add("tema-sore");
            else body.classList.add("tema-malam");
        }
        aturTemaDanTanggal();

        // NAVIGASI HALAMAN
        const halTulis = document.getElementById("halaman-tulis");
        const halRiwayat = document.getElementById("halaman-riwayat");
        const btnKeRiwayat = document.getElementById("btn-ke-riwayat");
        const btnKeTulis = document.getElementById("btn-ke-tulis");

        function bukaHalamanRiwayat() {
            halTulis.classList.remove("aktif");
            halRiwayat.classList.add("aktif");
            tampilkanCatatan();
        }

        function bukaHalamanTulis() {
            halRiwayat.classList.remove("aktif");
            halTulis.classList.add("aktif");
        }

        btnKeRiwayat.addEventListener("click", bukaHalamanRiwayat);
        btnKeTulis.addEventListener("click", bukaHalamanTulis);

        // DATA & STORAGE
        let kumpulanCatatan = JSON.parse(localStorage.getItem("data_jurnal")) || [];
        let fotoDataUrlTemp = "";

        // PENGHITUNG KATA DAN KARAKTER
        const isiCatatan = document.getElementById("isi-catatan");
        const penghitungKarakter = document.getElementById("penghitung-karakter");

        isiCatatan.addEventListener("input", function() {
            const teks = this.value.trim();
            const jmlKarakter = this.value.length;
            const jmlKata = teks === "" ? 0 : teks.split(/\s+/).length;
            penghitungKarakter.innerText = `${jmlKata} kata | ${jmlKarakter} karakter`;
        });

        // PROSES UNGGAH GAMBAR
        const inputFoto = document.getElementById("input-foto");
        const previewFoto = document.getElementById("preview-foto");

        inputFoto.addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        const maxDim = 1200;
                        let width = img.width;
                        let height = img.height;

                        if (width > height && width > maxDim) {
                            height *= maxDim / width; width = maxDim;
                        } else if (height > maxDim) {
                            width *= maxDim / height; height = maxDim;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        fotoDataUrlTemp = canvas.toDataURL("image/jpeg", 0.82);
                        previewFoto.src = fotoDataUrlTemp;
                        previewFoto.style.display = "block";
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        // SIMPAN CATATAN
        document.getElementById("tombol-simpan").addEventListener("click", function() {
            const teks = isiCatatan.value.trim();
            if (teks === "" && !fotoDataUrlTemp) {
                alert("Silakan masukkan teks atau lampirkan foto terlebih dahulu.");
                return;
            }

            const skrg = new Date();
            const catatanBaru = {
                id: Date.now(),
                isoDate: skrg.toISOString().split('T')[0],
                tanggalTeks: document.getElementById("tanggal-otomatis").innerText,
                bulanTahun: `${daftarBulan[skrg.getMonth()]} ${skrg.getFullYear()}`,
                isi: teks,
                foto: fotoDataUrlTemp
            };

            kumpulanCatatan.unshift(catatanBaru);
            localStorage.setItem("data_jurnal", JSON.stringify(kumpulanCatatan));

            isiCatatan.value = "";
            penghitungKarakter.innerText = "0 kata | 0 karakter";
            fotoDataUrlTemp = "";
            previewFoto.style.display = "none";
            inputFoto.value = "";

            bukaHalamanRiwayat();
        });

        // RENDER RIWAYAT CATATAN
        const areaDaftar = document.getElementById("daftar-catatan");
        const inputCariTanggal = document.getElementById("input-cari-tanggal");
        const inputCariTeks = document.getElementById("input-cari-teks");
        const btnResetFilter = document.getElementById("btn-reset-filter");

        function tampilkanCatatan() {
            areaDaftar.innerHTML = "";
            const tglFilter = inputCariTanggal.value;
            const teksFilter = inputCariTeks.value.toLowerCase().trim();

            const dataFiltered = kumpulanCatatan.filter(item => {
                const cocokTgl = !tglFilter || item.isoDate === tglFilter;
                const cocokTeks = !teksFilter || (item.isi && item.isi.toLowerCase().includes(teksFilter));
                return cocokTgl && cocokTeks;
            });

            if (dataFiltered.length === 0) {
                areaDaftar.innerHTML = "<p style='text-align:center; color:#7f8c8d; font-size:13px; margin:24px 0;'>Tidak ada catatan yang sesuai.</p>";
                return;
            }

            let bulanTerakhir = "";

            dataFiltered.forEach(item => {
                const teksTgl = item.tanggalTeks || item.tanggal || "Arsip Catatan";
                const blnThn = item.bulanTahun || "Arsip";

                if (blnThn !== bulanTerakhir && !tglFilter && !teksFilter) {
                    const divBulan = document.createElement("div");
                    divBulan.className = "pemisah-bulan";
                    divBulan.innerText = blnThn;
                    areaDaftar.appendChild(divBulan);
                    bulanTerakhir = blnThn;
                }

                const divItem = document.createElement("div");
                divItem.className = "kartu-catatan";
                divItem.innerHTML = `
                    <div class="tgl-catatan">${teksTgl}</div>
                    ${item.isi ? `<p class="isi-teks-catatan">${item.isi}</p>` : ''}
                    ${item.foto ? `<img src="${item.foto}" alt="Lampiran Catatan" onclick="bukaModalGambar('${item.foto}')">` : ''}
                `;
                areaDaftar.appendChild(divItem);
            });
        }

        inputCariTanggal.addEventListener("change", tampilkanCatatan);
        inputCariTeks.addEventListener("input", tampilkanCatatan);
        btnResetFilter.addEventListener("click", function() {
            inputCariTanggal.value = "";
            inputCariTeks.value = "";
            tampilkanCatatan();
        });

        // MODAL FULLSCREEN & ZOOM
        const modalViewer = document.getElementById("modal-viewer");
        const imgFullscreen = document.getElementById("img-fullscreen");
        const btnTutupModal = document.getElementById("btn-tutup-modal");

        let zoomLevel = 1;
        let startDist = 0;
        let lastTouchTime = 0;

        window.bukaModalGambar = function(srcUrl) {
            imgFullscreen.src = srcUrl;
            zoomLevel = 1;
            imgFullscreen.style.transform = `scale(${zoomLevel})`;
            modalViewer.classList.add("aktif");
        };

        function tutupModal() {
            modalViewer.classList.remove("aktif");
            imgFullscreen.src = "";
            zoomLevel = 1;
        }

        btnTutupModal.addEventListener("click", tutupModal);
        modalViewer.addEventListener("click", function(e) {
            if (e.target === modalViewer || e.target.id === "modal-wrapper") {
                tutupModal();
            }
        });

        // Double Tap Zoom
        imgFullscreen.addEventListener("click", function(e) {
            e.stopPropagation();
            const skrg = new Date().getTime();
            if (skrg - lastTouchTime < 300) {
                zoomLevel = (zoomLevel > 1) ? 1 : 2.2;
                imgFullscreen.style.transform = `scale(${zoomLevel})`;
            }
            lastTouchTime = skrg;
        });

        // Pinch-to-Zoom
        modalViewer.addEventListener("touchstart", function(e) {
            if (e.touches.length === 2) {
                startDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        }, { passive: true });

        modalViewer.addEventListener("touchmove", function(e) {
            if (e.touches.length === 2 && startDist > 0) {
                const currentDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                const scaleDiff = currentDist / startDist;
                let newZoom = Math.min(Math.max(zoomLevel * scaleDiff, 1), 3.5);
                imgFullscreen.style.transform = `scale(${newZoom})`;
            }
        }, { passive: true });

        modalViewer.addEventListener("touchend", function(e) {
            if (e.touches.length < 2) {
                startDist = 0;
            }
        }, { passive: true });
    </script>
