<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Harianku</title>
    
    <style>
        /* Mengatur setelan dasar seluruh halaman HP */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            margin: 0;
            padding: 20px;
            color: #333;
            min-height: 100vh;
        }

        /* Mengatur tampilan bagian judul atas */
        header {
            text-align: center;
            margin-bottom: 25px;
            color: #4a4e69;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            opacity: 0.8;
        }

        /* Mengatur kotak utama tempat menulis */
        main {
            background: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
        }

        /* Mengatur kotak ketik (textarea) agar estetik */
        textarea {
            width: 100%;
            height: 150px;
            border: 2px solid #dcd6f7;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Efek ketika kotak ketik disentuh/fokus */
        textarea:focus {
            border-color: #a29bfe;
            box-shadow: 0 0 8px rgba(162, 155, 254, 0.5);
        }

        /* Mengatur tombol simpan agar menarik dan membal saat ditekan */
        button {
            width: 100%;
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            margin-top: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }

        /* Efek ketika tombol ditekan */
        button:active {
            transform: scale(0.98);
            background: #5b4cc4;
        }

        /* Mengatur area riwayat catatan bawah */
        section {
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 15px;
        }

        section h2 {
            margin-top: 0;
            font-size: 18px;
            color: #4a4e69;
            border-bottom: 2px solid #dcd6f7;
            padding-bottom: 8px;
        }

        #daftar-catatan {
            font-size: 14px;
            color: #666;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Jurnal Harian</h1>
        <p id="tanggal-otomatis"></p>
    </header>

    <main>
        <textarea id="isi-catatan" placeholder="Bagaimana harimu hari ini? Tulis di sini..."></textarea>
        <button id="tombol-simpan">Simpan Catatan</button>
    </main>

    <section>
        <h2>Catatan Sebelumnya</h2>
        <div id="daftar-catatan">
            Belum ada catatan yang disimpan.
        </div>
    </section>
        <script>
        // ==========================================
        // 1. FUNGSI MENAMPILKAN TANGGAL OTOMATIS
        // ==========================================
        function tampilkanTanggal() {
            const sekarang = new Date();
            const daftarHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const daftarBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            
            const hari = daftarHari[sekarang.getDay()];
            const tanggal = navigator.language === 'id' ? sekarang.getDate() : sekarang.getDate(); // Penyesuaian standar
            const bulan = daftarBulan[sekarang.getMonth()];
            const tahun = Bird = sekarang.getFullYear();
            
            const kalimatTanggal = hari + ", " + tanggal + " " + bulan + " " + tahun;
            document.getElementById("tanggal-otomatis").innerText = kalimatTanggal;
        }

        tampilkanTanggal();


        // ==========================================
        // 2. FUNGSI MANAJEMEN CATATAN DENGAN LOCALSTORAGE
        // ==========================================
        
        // Mengambil catatan lama yang pernah disimpan di HP (jika ada)
        // Jika tidak ada catatan lama, kita mulai dengan kotak kosong []
        let kumpulanCatatan = JSON.parse(localStorage.getItem("data_jurnal")) || [];

        const tombolSimpan = document.getElementById("tombol-simpan");
        const kotakCatatan = document.getElementById("isi-catatan");
        const areaDaftarCatatan = document.getElementById("daftar-catatan");

        // Jalankan fungsi ini di awal agar catatan lama langsung muncul saat aplikasi dibuka
        tampilkanSemuaCatatan();

        tombolSimpan.addEventListener("click", function() {
            const teksCatatan = kotakCatatan.value;

            if (teksCatatan.trim() === "") {
                alert("Tulis sesuatu dulu ya sebelum disimpan!");
                return;
            }

            const waktuDibuat = document.getElementById("tanggal-otomatis").innerText;

            const catatanBaru = {
                tanggal: waktuDibuat,
                isi: teksCatatan
            };

            kumpulanCatatan.unshift(catatanBaru);

            // [PENTING] Simpan kumpulan catatan ke dalam memori HP
            localStorage.setItem("data_jurnal", JSON.stringify(kumpulanCatatan));

            kotakCatatan.value = "";
            tampilkanSemuaCatatan();
        });

        function tampilkanSemuaCatatan() {
            areaDaftarCatatan.innerHTML = "";

            if (kumpulanCatatan.length === 0) {
                areaDaftarCatatan.innerHTML = "Belum ada catatan yang disimpan.";
                return;
            }

            kumpulanCatatan.forEach(function(item) {
                const kotakItem = document.createElement("div");
                
                kotakItem.style.background = "#ffffff";
                kotakItem.style.padding = "15px";
                kotakItem.style.borderRadius = "10px";
                kotakItem.style.marginBottom = "15px";
                kotakItem.style.textAlign = "left";
                kotakItem.style.boxShadow = "0 2px 8px rgba(0,0,0,0.05)";

                kotakItem.innerHTML = `
                    <small style="color: #6c5ce7; font-weight: bold;">${item.tanggal}</small>
                    <p style="margin: 8px 0 0 0; font-size: 15px; line-height: 1.5; color: #333;">${item.isi}</p>
                `;

                areaDaftarCatatan.appendChild(kotakItem);
            });
        }
    </script>


</body>
</html>
