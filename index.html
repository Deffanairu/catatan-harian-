<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Harianku</title>
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background-size: 300% 300%;
            animation: gerakLatar 12s ease infinite;
            transition: background 2s ease-in-out;
        }

        /* TEMA WAKTU */
        body.tema-pagi { background-image: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb); color: #2c3e50; }
        body.tema-siang { background-image: linear-gradient(-45deg, #2980b9, #6dd5fa, #ffffff, #89f7fe); color: #1a252f; }
        body.tema-sore { background-image: linear-gradient(-45deg, #ff512f, #dd2476, #8e54e9, #4776e6); color: #ffffff; }
        body.tema-malam { background-image: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #141e30); color: #f1f2f6; }

        @keyframes gerakLatar {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ELEMEN SUASANA (PURE CSS) */
        .sky-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }

        .celestial-body {
            position: absolute; width: 70px; height: 70px; border-radius: 50%;
            transition: all 1.5s ease-in-out; will-change: transform, opacity;
        }
        .tema-pagi .celestial-body { top: 15%; left: 10%; background: radial-gradient(circle, #fff7ad, #ffa07a); box-shadow: 0 0 40px rgba(255, 160, 122, 0.8); animation: terbitPagi 4s ease-out forwards, mengapungLembut 6s ease-in-out infinite alternate; }
        .tema-siang .celestial-body { top: 6%; right: 15%; background: radial-gradient(circle, #ffffff, #ffea75); box-shadow: 0 0 50px rgba(255, 234, 117, 0.9); animation: mengapungLembut 5s ease-in-out infinite alternate; }
        .tema-sore .celestial-body { top: 45%; right: 12%; background: radial-gradient(circle, #ff7e5f, #feb47b); box-shadow: 0 0 45px rgba(255, 126, 95, 0.8); animation: terbenamSore 4s ease-out forwards, mengapungLembut 7s ease-in-out infinite alternate; }
        .tema-malam .celestial-body { top: 10%; right: 12%; background: radial-gradient(circle, #ffffff, #dcdde1); box-shadow: 0 0 35px rgba(255, 255, 255, 0.6); animation: mengapungLembut 8s ease-in-out infinite alternate; }

        @keyframes terbitPagi { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes terbenamSore { from { transform: translateY(-40px); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
        @keyframes mengapungLembut { 0% { transform: translateY(0px); } 100% { transform: translateY(-8px); } }

        .cloud { position: absolute; background: rgba(255, 255, 255, 0.45); border-radius: 50px; opacity: 0.7; will-change: transform; }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.45); border-radius: 50%; }
        .cloud1 { width: 100px; height: 32px; top: 8%; animation: gerakAwan 28s linear infinite; }
        .cloud1::before { width: 42px; height: 42px; top: -18px; left: 18px; }
        .cloud1::after { width: 32px; height: 32px; top: -12px; right: 18px; }
        .cloud2 { width: 140px; height: 42px; top: 22%; animation: gerakAwan 42s linear infinite; animation-delay: -15s; opacity: 0.5; }
        .cloud2::before { width: 55px; height: 55px; top: -24px; left: 22px; }
        .cloud2::after { width: 42px; height: 42px; top: -18px; right: 22px; }
        .tema-malam .cloud, .tema-malam .cloud::before, .tema-malam .cloud::after { background: rgba(255, 255, 255, 0.12); }
        @keyframes gerakAwan { from { left: -160px; } to { left: 105%; } }

        .bird-group { position: absolute; top: 14%; will-change: transform; animation: terbangBurung 22s linear infinite; }
        .tema-malam .bird-group { display: none; }
        .bird { position: relative; width: 16px; height: 12px; display: inline-block; margin-right: 8px; }
        .bird::before, .bird::after { content: ''; position: absolute; top: 0; width: 9px; height: 6px; border-top: 2px solid rgba(40, 40, 40, 0.65); border-left: 2px solid rgba(40, 40, 40, 0.65); border-top-left-radius: 8px; }
        .tema-sore .bird::before, .tema-sore .bird::after { border-color: rgba(255, 255, 255, 0.75); }
        .bird::before { left: 0; transform-origin: right bottom; animation: kepakSayap 0.8s ease-in-out infinite alternate; }
        .bird::after { right: 0; transform: scaleX(-1); transform-origin: right bottom; animation: kepakSayap 0.8s ease-in-out infinite alternate; }
        .bird-2 { top: -6px; transform: scale(0.75); }
        @keyframes kepakSayap { 0% { transform: rotate(0deg); } 100% { transform: rotate(-35deg); } }
        @keyframes terbangBurung { from { left: -60px; } to { left: 105%; } }

        /* WIDGET UTAMA & KONTROL HALAMAN */
        .content-wrapper {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
        }

        header { text-align: center; margin-bottom: 25px; }
        header h1 { margin: 0; font-size: 28px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.15); }
        header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.9; }

        /* MULTI-PAGE MANAGEMENT */
        .halaman {
            display: none; /* Sembunyikan halaman yang tidak aktif secara default */
            background: rgba(255, 255, 255, 0.88);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
            color: #333;
            animation: fadeIn 0.4s ease-in-out;
        }

        .halaman.aktif {
            display: block; /* Hanya tampilkan halaman dengan kelas 'aktif' */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        textarea {
            width: 100%; height: 120px; border: 2px solid #dcd6f7; border-radius: 10px;
            padding: 12px; font-size: 16px; resize: none; outline: none; transition: all 0.3s ease; font-family: inherit;
        }
        textarea:focus { border-color: #6c5ce7; box-shadow: 0 0 8px rgba(108, 92, 231, 0.3); }

        button {
            width: 100%; background: #6c5ce7; color: white; border: none; padding: 14px;
            font-size: 16px; font-weight: bold; border-radius: 10px; margin-top: 15px;
            cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }
        button:active { transform: scale(0.98); }

        .btn-sekunder {
            background: #a29bfe;
            box-shadow: 0 4px 12px rgba(162, 155, 254, 0.3);
        }

        .header-riwayat {
            display: flex; flex-direction: column; gap: 10px; border-bottom: 2px solid #e0e0e0;
            padding-bottom: 12px; margin-bottom: 15px;
        }
        .header-riwayat h2 { margin: 0; font-size: 18px; color: #4a4e69; }

        .filter-box { display: flex; gap: 8px; }
        input[type="date"] {
            flex: 1; padding: 8px 12px; border: 2px solid #dcd6f7; border-radius: 8px; outline: none; font-family: inherit;
        }

        .btn-reset { width: auto; margin-top: 0; padding: 8px 12px; background: #a29bfe; font-size: 12px; }

        .pemisah-bulan {
            background: #6c5ce7; color: white; padding: 6px 12px; border-radius: 6px;
            font-size: 13px; font-weight: bold; margin: 15px 0 10px 0; text-align: left; display: inline-block;
        }

        #daftar-catatan { font-size: 14px; }
    </style>
</head>
<body id="body-layar">

    <div class="sky-container">
        <div class="celestial-body"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="bird-group">
            <div class="bird"></div>
            <div class="bird bird-2"></div>
        </div>
    </div>

    <div class="content-wrapper">
        <header>
            <h1>Jurnal Harian</h1>
            <p id="tanggal-otomatis"></p>
        </header>

        <!-- HALAMAN 1: TULIS CATATAN -->
        <div id="halaman-tulis" class="halaman aktif">
            <textarea id="isi-catatan" placeholder="Bagaimana harimu hari ini? Tulis di sini..."></textarea>
            <button id="tombol-simpan">Simpan Catatan</button>
            <button id="btn-ke-riwayat" class="btn-sekunder">📖 Lihat Riwayat Catatan</button>
        </div>

        <!-- HALAMAN 2: RIWAYAT & PENCARIAN -->
        <div id="halaman-riwayat" class="halaman">
            <div class="header-riwayat">
                <h2>Riwayat Catatan</h2>
                <div class="filter-box">
                    <input type="date" id="input-cari-tanggal">
                    <button id="btn-reset-filter" class="btn-reset">Reset</button>
                </div>
            </div>

            <div id="daftar-catatan"></div>

            <button id="btn-ke-tulis" class="btn-sekunder" style="margin-top: 20px;">✏️ Kembali Tulis Catatan</button>
        </div>
    </div>

    <script>
        const daftarHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const daftarBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        // 1. FUNGSI WAKTU & TEMA
        function aturTemaDanTanggal() {
            const skrg = new Date();
            const jam = skrg.getHours();
            const body = document.getElementById("body-layar");

            const teksTanggal = `${daftarHari[skrg.getDay()]}, ${skrg.getDate()} ${daftarBulan[skrg.getMonth()]} ${skrg.getFullYear()}`;
            document.getElementById("tanggal-otomatis").innerText = teksTanggal;

            body.className = "";
            if (jam >= 5 && jam < 11) body.classList.add("tema-pagi");
            else if (jam >= 11 && jam < 15) body.classList.add("tema-siang");
            else if (jam >= 15 && jam < 18) body.classList.add("tema-sore");
            else body.classList.add("tema-malam");
        }
        aturTemaDanTanggal();

        // 2. NAVIGASI HALAMAN (SPA)
        const halTulis = document.getElementById("halaman-tulis");
        const halRiwayat = document.getElementById("halaman-riwayat");
        const btnKeRiwayat = document.getElementById("btn-ke-riwayat");
        const btnKeTulis = document.getElementById("btn-ke-tulis");

        function bukaHalamanRiwayat() {
            halTulis.classList.remove("aktif");
            halRiwayat.classList.add("aktif");
            tampilkanSemuaCatatan(kumpulanCatatan);
        }

        function bukaHalamanTulis() {
            halRiwayat.classList.remove("aktif");
            halTulis.classList.add("aktif");
        }

        btnKeRiwayat.addEventListener("click", bukaHalamanRiwayat);
        btnKeTulis.addEventListener("click", bukaHalamanTulis);

        // 3. MANAJEMEN DATA & LOCALSTORAGE
        let kumpulanCatatan = JSON.parse(localStorage.getItem("data_jurnal")) || [];

        const tombolSimpan = document.getElementById("tombol-simpan");
        const kotakCatatan = document.getElementById("isi-catatan");
        const areaDaftar = document.getElementById("daftar-catatan");
        const inputCari = document.getElementById("input-cari-tanggal");
        const btnReset = document.getElementById("btn-reset-filter");

        tombolSimpan.addEventListener("click", function() {
            const teks = kotakCatatan.value.trim();
            if (teks === "") {
                alert("Tulis sesuatu dulu ya sebelum disimpan!");
                return;
            }

            const skrg = new Date();
            const catatanBaru = {
                id: Date.now(),
                isoDate: skrg.toISOString().split('T')[0],
                tanggalTeks: document.getElementById("tanggal-otomatis").innerText,
                bulanTahun: `${daftarBulan[skrg.getMonth()]} ${skrg.getFullYear()}`,
                isi: teks
            };

            kumpulanCatatan.unshift(catatanBaru);
            localStorage.setItem("data_jurnal", JSON.stringify(kumpulanCatatan));

            kotakCatatan.value = "";
            inputCari.value = "";
            
            // Otomatis Pindah Ke Halaman Riwayat Setelah Menyimpan!
            bukaHalamanRiwayat();
        });

        // PENCARIAN TANGGAL
        inputCari.addEventListener("change", function() {
            const tglDicari = this.value;
            if (!tglDicari) {
                tampilkanSemuaCatatan(kumpulanCatatan);
                return;
            }
            const hasilFilter = kumpulanCatatan.filter(item => item.isoDate === tglDicari);
            tampilkanSemuaCatatan(hasilFilter);
        });

        btnReset.addEventListener("click", function() {
            inputCari.value = "";
            tampilkanSemuaCatatan(kumpulanCatatan);
        });

        // RENDER RIWAYAT CATATAN
        function tampilkanSemuaCatatan(data) {
            areaDaftar.innerHTML = "";

            if (data.length === 0) {
                areaDaftar.innerHTML = "<p style='text-align:center;'>Tidak ada catatan yang ditemukan.</p>";
                return;
            }

            let bulanTerakhir = "";

            data.forEach(item => {
                // Penanganan Catatan Lama (Memperbaiki Tulisan "undefined")
                const teksTanggalFix = item.tanggalTeks || item.tanggal || "Catatan Lama";
                const bulanTahunFix = item.bulanTahun || "Arsip Catatan";

                if (bulanTahunFix !== bulanTerakhir && !inputCari.value) {
                    const divBulan = document.createElement("div");
                    divBulan.className = "pemisah-bulan";
                    divBulan.innerText = bulanTahunFix;
                    areaDaftar.appendChild(divBulan);
                    bulanTerakhir = bulanTahunFix;
                }

                const divItem = document.createElement("div");
                divItem.style.background = "#ffffff";
                divItem.style.padding = "15px";
                divItem.style.borderRadius = "10px";
                divItem.style.marginBottom = "12px";
                divItem.style.textAlign = "left";
                divItem.style.boxShadow = "0 2px 8px rgba(0,0,0,0.05)";

                divItem.innerHTML = `
                    <small style="color: #6c5ce7; font-weight: bold;">${teksTanggalFix}</small>
                    <p style="margin: 8px 0 0 0; font-size: 15px; line-height: 1.5; color: #333;">${item.isi}</p>
                `;

                areaDaftar.appendChild(divItem);
            });
        }
    </script>
</body>
</html>
